<!DOCTYPE html>
<html>
<head>      
    <title>JSdemo</title>
</head>
<body>
    <!-- <h2 id="hellohere">text here</h2> -->
     <input type="number" id="num1" value="5">
     <input type="number" id="num2" value="2">
     <button onclick="addNumbers()">Add Numbers</button>
     <p id="result">Answer here!</p>

     <script>
        function addNumbers() {
            var number1 = parseFloat(document.getElementById("num1").value);
            var number2 = parseFloat(document.getElementById("num2").value);
            var sum = number1 + number2;
            placetoput =document.getElementById("result");
            placetoput.innerHTML = "The sum is: " + sum;
        }
        //alert("Hello, World!");

        //placetoput.innerHTML="Hello, World!";
    </script>
</body>
